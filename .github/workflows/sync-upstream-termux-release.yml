name: Sync upstream tag and release Termux build

# GitHub Actions cannot listen to other repositories' tag events, so this
# workflow polls the upstream (esengine/DeepSeek-Reasonix) latest tag on a
# schedule and publishes a release only when it differs from the last one
# (release tags are prefixed `termux-`, e.g. `termux-v1.21.3`).

on:
  schedule:
    # Daily check; a full go test run keeps us inside the free Actions quota.
    - cron: '0 4 * * *'
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  sync-upstream:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout this repo (patch + script)
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Resolve latest upstream tag
        id: upstream
        run: |
          TAG="$(git ls-remote --tags --refs https://github.com/esengine/DeepSeek-Reasonix.git \
            | awk -F/ '{print $NF}' | grep -v -- '-rc' | sort -V | tail -1)"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "Latest upstream tag: $TAG"

      - name: Skip if already released
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          REL_TAG="termux-${{ steps.upstream.outputs.tag }}"
          if gh release list --limit 100 --json tagName -q '.[].tagName' | grep -qx "$REL_TAG"; then
            echo "Release $REL_TAG already exists; nothing to do"
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Clone upstream and apply patch
        if: steps.check.outputs.skip == 'false'
        run: |
          git clone --depth 1 --branch "${{ steps.upstream.outputs.tag }}" \
            https://github.com/esengine/DeepSeek-Reasonix.git "$GITHUB_WORKSPACE/upstream"
          cd "$GITHUB_WORKSPACE/upstream"
          git apply --check "$GITHUB_WORKSPACE/reasonix-termux.patch"
          git apply "$GITHUB_WORKSPACE/reasonix-termux.patch"
          echo "Patch applied: $(grep -c '^diff --git' "$GITHUB_WORKSPACE/reasonix-termux.patch") files"

      - name: Build android binary
        if: steps.check.outputs.skip == 'false'
        working-directory: upstream
        run: |
          make android VERSION="${{ steps.upstream.outputs.tag }}"
          ls -lh bin/

      - name: Run tests
        if: steps.check.outputs.skip == 'false'
        working-directory: upstream
        run: |
          set +e
          go test -count=1 ./... 2>&1 | tee test.log
          status=${PIPESTATUS[0]}
          set -e
          # Fail the job when any package fails; otherwise a broken tree
          # would still get synced and released.
          test "$status" -eq 0

      - name: Sync sources back to this repo
        if: steps.check.outputs.skip == 'false'
        run: |
          cd "$GITHUB_WORKSPACE"
          # Replace everything except repo-specific files with upstream+patch.
          find . -mindepth 1 -maxdepth 1 \
            ! -name .git ! -name .github ! -name .gitignore ! -name upstream \
            ! -name reasonix-termux.patch ! -name update-reasonix.sh \
            -exec rm -rf {} +
          rsync -a --exclude='.git' --exclude='.github' --exclude='.gitignore' \
            --exclude='reasonix-termux.patch' --exclude='update-reasonix.sh' \
            "$GITHUB_WORKSPACE/upstream/" "$GITHUB_WORKSPACE/"
          git add -A
          git -c user.name="reasonix-termux-bot" \
              -c user.email="reasonix-termux-bot@users.noreply.github.com" \
              commit -m "sync upstream ${{ steps.upstream.outputs.tag }} (Termux patch applied)"
          git push origin master
          echo "Sources synced to master"

      - name: Create release
        if: steps.check.outputs.skip == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${{ steps.upstream.outputs.tag }}"
          REL_TAG="termux-$TAG"
          printf '%s\n' \
            "Automatic Termux build of upstream [$TAG](https://github.com/esengine/DeepSeek-Reasonix/releases/tag/$TAG) with the Termux adaptation patch." \
            "" \
            "- **reasonix-android-arm64**: prebuilt binary (GOOS=android GOARCH=arm64, version $TAG)" \
            "- **reasonix-termux.patch**: the adaptation patch (16 files)" \
            "- **update-reasonix.sh**: rebuild/update script" \
            "" \
            "Install:" \
            '```' \
            "cp reasonix-android-arm64 \$PREFIX/bin/reasonix" \
            "reasonix -v" \
            '```' > notes.md
          gh release create "$REL_TAG" \
            "$GITHUB_WORKSPACE/upstream/bin/reasonix-android-arm64" \
            "$GITHUB_WORKSPACE/reasonix-termux.patch" \
            "$GITHUB_WORKSPACE/update-reasonix.sh" \
            --title "Reasonix $TAG — Termux build" \
            --notes-file notes.md
