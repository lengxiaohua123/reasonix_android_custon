name: Sync upstream tag and release Termux build

# GitHub Actions cannot listen to other repositories' tag events. This
# workflow is now manual-only: it syncs this repo's master to the latest
# upstream tag (Termux patch applied). Building and releasing are done
# locally on Termux (see release-termux.sh + verify-and-release.yml).

on:
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  sync-upstream:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout this repo (patch + script)
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Resolve latest upstream tag
        id: upstream
        run: |
          TAG="$(git ls-remote --tags --refs https://github.com/esengine/DeepSeek-Reasonix.git \
            | awk -F/ '{print $NF}' | grep -v -- '-rc' | sort -V | tail -1)"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "Latest upstream tag: $TAG"

      - name: Skip if already released
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          REL_TAG="termux-${{ steps.upstream.outputs.tag }}"
          if gh release list --limit 100 --json tagName -q '.[].tagName' | grep -qx "$REL_TAG"; then
            echo "Release $REL_TAG already exists; nothing to do"
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Clone upstream and apply patch
        if: steps.check.outputs.skip == 'false'
        run: |
          git clone --depth 1 --branch "${{ steps.upstream.outputs.tag }}" \
            https://github.com/esengine/DeepSeek-Reasonix.git "$GITHUB_WORKSPACE/upstream"
          cd "$GITHUB_WORKSPACE/upstream"
          git apply --check "$GITHUB_WORKSPACE/reasonix-termux.patch"
          git apply "$GITHUB_WORKSPACE/reasonix-termux.patch"
          echo "Patch applied: $(grep -c '^diff --git' "$GITHUB_WORKSPACE/reasonix-termux.patch") files"

      - name: Sync sources back to this repo
        if: steps.check.outputs.skip == 'false'
        run: |
          cd "$GITHUB_WORKSPACE"
          # Replace everything except repo-specific files with upstream+patch.
          find . -mindepth 1 -maxdepth 1 \
            ! -name .git ! -name .github ! -name .gitignore ! -name upstream \
            ! -name artifacts \
            ! -name reasonix-termux.patch ! -name update-reasonix.sh \
            -exec rm -rf {} +
          rsync -a --exclude='.git' --exclude='.github' --exclude='.gitignore' \
            --exclude='reasonix-termux.patch' --exclude='update-reasonix.sh' \
            "$GITHUB_WORKSPACE/upstream/" "$GITHUB_WORKSPACE/"
          git add -A
          git -c user.name="reasonix-termux-bot" \
              -c user.email="reasonix-termux-bot@users.noreply.github.com" \
              commit -m "sync upstream ${{ steps.upstream.outputs.tag }} (Termux patch applied)"
          git push origin master
          echo "Sources synced to master"
